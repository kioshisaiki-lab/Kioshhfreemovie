<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>1Flex - Stream & Discover Movies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header>
    <div class="logo">1FLEX</div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search movies, TV shows...">
      <button id="searchBtn">Search</button>
    </div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <h1>Discover Unlimited Movies & TV Shows</h1>
    <p>Explore trending titles, cast details, and official trailers.</p>
  </section>

  <!-- Content Container -->
  <main class="container">
    <h2 id="sectionTitle">Trending Movies</h2>
    <div id="movieGrid" class="movie-grid">
      <!-- Cards will be populated dynamically -->
    </div>
  </main>

  <!-- Trailer / Info Modal -->
  <div id="movieModal" class="modal">
    <div class="modal-content">
      <span class="close-btn" id="closeModal">&times;</span>
      <div id="modalBody"></div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
